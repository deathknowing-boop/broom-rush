<style>html, body { margin: 0; height: 100%; background: #0c1626; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; user-select: none; }
#gl { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; outline: none; cursor: crosshair; touch-action: none; }
#boot { position: fixed; left: 0; right: 0; bottom: 12vh; text-align: center; font-size: 15px; letter-spacing: 0.3em; opacity: 0.85; pointer-events: none; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5); }

#hud .spd small { font-family: "Avenir Next", "PingFang SC", sans-serif; font-style: normal; font-size: 0.19em; letter-spacing: 0.34em; margin-left: 0.7em; opacity: 0.85; vertical-align: 0.5em; }
#hud .gust { position: absolute; left: 3.2vw; bottom: 4.2vh; width: clamp(140px, 15vw, 230px); }
#hud .gust .bar { height: 3px; background: rgba(255, 255, 255, 0.28); border-radius: 2px; overflow: hidden; }

#hud.low .gust .bar i { background: linear-gradient(90deg, #fff, #ffb86b); box-shadow: 0 0 10px rgba(255, 190, 110, 0.9); }

#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 13vh; box-sizing: border-box; text-align: center; transition: opacity 0.9s, transform 0.9s; text-shadow: 0 2px 22px rgba(0, 30, 70, 0.55); background: radial-gradient(ellipse at center, rgba(8, 30, 60, 0.12), rgba(8, 30, 60, 0.0) 60%); }

#title h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif; font-weight: 600; font-size: clamp(56px, 9vw, 132px); letter-spacing: 0.22em; text-indent: 0.22em; }
#title p { margin: 0.6em 0 0; font-size: clamp(13px, 1.25vw, 19px); letter-spacing: 0.5em; text-indent: 0.5em; opacity: 0.92; }
#title .go { position: absolute; top: 66vh; font-size: clamp(13px, 1.1vw, 17px); letter-spacing: 0.5em; text-indent: 0.5em; padding: 0.85em 2.2em; border: 1px solid rgba(255, 255, 255, 0.75); border-radius: 999px; animation: breathe 2.4s ease-in-out infinite; backdrop-filter: blur(3px); background: rgba(255, 255, 255, 0.08); }

#toast { position: absolute; left: 0; right: 0; top: 9vh; text-align: center; font-size: 14px; letter-spacing: 0.4em; opacity: 0; transition: opacity 0.5s; text-shadow: 0 1px 10px rgba(0, 30, 60, 0.6); }

/* ---- 加载进度（index.html / build.mjs 的外壳里有 #bootbar）---- */
#bootbar { position: fixed; left: 50%; bottom: calc(12vh - 18px); width: min(220px, 50vw); height: 2px; margin-left: min(-110px, -25vw); background: rgba(255, 255, 255, 0.18); border-radius: 1px; overflow: hidden; pointer-events: none; transition: opacity 0.4s; }

#boot.err { color: #ffe0c8; letter-spacing: 0.12em; line-height: 1.9; padding: 0 6vw; font-size: 14px; white-space: pre-line; user-select: text; -webkit-user-select: text; pointer-events: auto; }

/* ---- 触屏（#ui.touch）：左手虚拟摇杆、右下加速 / 减速按钮；避开刘海和手势条 ---- */
#ui { --sr: max(4vw, calc(env(safe-area-inset-right, 0px) + 12px)); --sl: max(3.2vw, calc(env(safe-area-inset-left, 0px) + 10px)); --sb: max(5vh, calc(env(safe-area-inset-bottom, 0px) + 14px)); --st: max(2.6vh, calc(env(safe-area-inset-top, 0px) + 8px)); --bs: clamp(72px, 19vmin, 104px); --ss: clamp(52px, 13vmin, 74px); }
#touch { display: none; position: absolute; inset: 0; }
#ui.touch.run #touch { display: block; }
.tbtn { position: absolute; bottom: var(--sb); box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.72); background: rgba(255, 255, 255, 0.1); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: 0.3em; text-indent: 0.3em; text-shadow: 0 1px 6px rgba(0, 30, 60, 0.5); pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; transition: background 0.12s, transform 0.12s; }
.tbtn.down { background: rgba(255, 222, 180, 0.38); border-color: #ffe3c0; transform: scale(0.94); }
#tBoost { right: var(--sr); width: var(--bs); height: var(--bs); }
#tBrake { right: calc(var(--sr) + var(--bs) + 16px); width: var(--ss); height: var(--ss); font-size: 12px; }
#tWave { right: calc(var(--sr) + var(--bs) * 0.15); bottom: calc(var(--sb) + var(--bs) + 14px); width: calc(var(--ss) * 0.8); height: calc(var(--ss) * 0.8); font-size: 11px; }
#tStick { position: absolute; left: 0; top: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; }
#tStick.on { opacity: 1; }
#tStick i { width: 42%; height: 42%; border-radius: 50%; background: rgba(255, 255, 255, 0.55); box-shadow: 0 0 12px rgba(255, 255, 255, 0.4); }
#ui.touch #hud .spd { bottom: auto; top: var(--st); right: var(--sr); font-size: clamp(30px, 4.6vw, 52px); }
#ui.touch #hud .gust { left: auto; bottom: auto; right: var(--sr); top: calc(var(--st) + clamp(30px, 4.6vw, 52px) + 16px); width: clamp(110px, 15vw, 180px); }
#tInfo { display: none; position: absolute; left: var(--sl); top: var(--st); width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.6); font: italic 15px/24px Georgia, serif; text-align: center; opacity: 0.7; pointer-events: auto; touch-action: none; }
#ui.touch.run #tInfo { display: block; }
#ui.touch #toast { top: calc(var(--st) + clamp(30px, 4.6vw, 52px) + 54px); padding: 0 6vw; letter-spacing: 0.24em; line-height: 1.7; }

/* ---- 帧率与设备信息 ---- */
#diag { display: none; position: absolute; left: var(--sl); top: var(--st); max-width: min(92vw, 680px); padding: 6px 9px; border-radius: 6px; background: rgba(6, 16, 30, 0.55); font: 11px/1.55 Menlo, Consolas, monospace; letter-spacing: 0.02em; pointer-events: auto; }
#ui.touch #diag { top: calc(var(--st) + 34px); }
#diag.on { display: block; }
#diagT { white-space: pre-wrap; word-break: break-all; }
#diagC { margin-top: 5px; padding: 3px 12px; font: 12px "PingFang SC", sans-serif; letter-spacing: 0.2em; color: #fff; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 999px; touch-action: manipulation; }
#diagX { display: none; width: 100%; height: 6.5em; margin-top: 6px; box-sizing: border-box; font: 10px/1.4 Menlo, monospace; color: #fff; background: rgba(0, 0, 0, 0.45); border: 0; border-radius: 4px; resize: none; user-select: text; -webkit-user-select: text; touch-action: auto; }
#diagX.on { display: block; }

/* 矮的横屏（手机横过来）：标题收小、上移，别压住角色 */
@media (max-height: 500px) {
  #title { padding-top: 7vh; }
  #title h1 { font-size: clamp(40px, 15vh, 96px); }
  #title p { font-size: 12px; margin-top: 0.4em; }
  #title .go { top: 70vh; padding: 0.7em 2em; }
  #title .keys { bottom: 3.5vh; }
}

.pill { display: inline-block; padding: 0.35em 1.2em; border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 999px; font-size: 12px; letter-spacing: 0.24em; background: rgba(255, 255, 255, 0.1); pointer-events: auto; touch-action: manipulation; cursor: pointer; }
#flash { position: absolute; left: 0; right: 0; top: 30vh; text-align: center; font-family: "Songti SC", "STSong", serif; font-weight: 600; font-size: clamp(30px, 4.4vw, 60px); letter-spacing: 0.4em; text-indent: 0.4em; opacity: 0; text-shadow: 0 2px 20px rgba(0, 30, 70, 0.6), 0 0 30px rgba(255, 210, 140, 0.5); }

#chal { position: absolute; left: 0; right: 0; top: 3vh; text-align: center; opacity: 0; transition: opacity 0.4s; text-shadow: 0 1px 3px rgba(0, 30, 60, 0.7), 0 1px 12px rgba(0, 30, 60, 0.6); }

#card { position: absolute; left: 50%; top: 18vh; transform: translate(-50%, 10px); min-width: min(320px, 80vw); padding: 18px 28px 16px; box-sizing: border-box; text-align: center; border-radius: 14px; background: linear-gradient(180deg, rgba(10, 28, 52, 0.62), rgba(10, 28, 52, 0.42)); border: 1px solid rgba(255, 255, 255, 0.25); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; transition: opacity 0.4s, transform 0.4s; pointer-events: none; }
#card.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#card small { font-size: 11px; letter-spacing: 0.4em; opacity: 0.7; }

#cdV { margin-top: 8px; font-family: Georgia, serif; font-style: italic; font-size: 38px; }
#cdM { margin-top: 2px; font-size: 15px; letter-spacing: 0.5em; text-indent: 0.5em; }
#cdM.m1 { color: #f0b48a; } #cdM.m2 { color: #e4ecf5; } #cdM.m3 { color: #ffd76a; text-shadow: 0 0 14px rgba(255, 210, 100, 0.8); } #cdM.m0 { opacity: 0.7; }

#mark { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.4s; pointer-events: none; }

#mark i { position: absolute; left: -7px; top: -22px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid #ffd27a; transform-origin: 7px 22px; filter: drop-shadow(0 1px 4px rgba(0, 20, 50, 0.6)); }
#mark:not(.edge) i { transform: rotate(180deg); }

#journey { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 18, 36, 0.35); pointer-events: auto; }
#journey.on { display: flex; }

#tJ { display: none; position: absolute; left: calc(var(--sl) + 36px); top: var(--st); height: 26px; padding: 0 12px; box-sizing: border-box; border-radius: 13px; border: 1px solid rgba(255, 255, 255, 0.6); font-size: 12px; line-height: 24px; letter-spacing: 0.2em; opacity: 0.85; pointer-events: auto; touch-action: none; }

#draft { position: absolute; right: 3.2vw; bottom: calc(3.6vh + clamp(34px, 4.6vw, 68px) + 10px); font-size: 12px; letter-spacing: 0.4em; color: #bfe8ff; opacity: 0; transition: opacity 0.25s; text-shadow: 0 0 10px rgba(120, 200, 255, 0.9); }
